[project]
license = "Apache-2.0"
name = "tensordem"
version = "0.1.0"
description = "A PyTorch bonded-particle DEM prototype for ice breaking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
test = [
    "pytest>=8.3",
]
viz = [
    "matplotlib>=3.8",
    "pillow>=10.0",
]
all = [
    "torch>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.scripts]
tensordem = "tensordem.cli:main"
tensordem-3d = "tensordem.dem3d_cli:main"
tensordem-energy-audit = "tensordem.ice_structure_energy_audit_cli:main"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running integration test (DEM campaign sanity run)",
]
