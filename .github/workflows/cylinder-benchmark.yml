name: DEM3D cylinder long-run benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/tensordem/**"
      - "scripts/run_dem3d_cylinder_benchmark.py"
      - "scripts/plot_dem3d_cylinder_benchmark.py"
      - "tests/test_dem3d_cylinder_benchmark.py"
      - ".github/workflows/cylinder-benchmark.yml"

permissions:
  contents: read

jobs:
  cylinder-long-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,viz]"

      - name: Run end-to-end integration tests
        run: python -m unittest discover -s tests -p 'test_dem3d_cylinder_benchmark.py' -v

      - name: Run 4000-step cylinder compression
        run: |
          python scripts/run_dem3d_cylinder_benchmark.py \
            --steps 4000 --save-every 10 \
            --nx 9 --ny 3 --nz 9 \
            --platen-speed 0.002 \
            --output results-cylinder-long

      - name: Generate force and fracture plots
        run: |
          python scripts/plot_dem3d_cylinder_benchmark.py \
            results-cylinder-long --format both

      - name: Validate benchmark outputs
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("results-cylinder-long")
          summary = json.loads((root / "benchmark_summary.json").read_text())
          with (root / "history.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) >= 100, f"too few history samples: {len(rows)}"
          assert summary["samples"] == len(rows)
          for i, row in enumerate(rows):
              for key in ("time_s", "mechanical_energy_J", "top_platen_reaction_z_N",
                          "bottom_platen_reaction_z_N", "broken_bonds"):
                  value = float(row[key])
                  assert math.isfinite(value), f"non-finite {key} at row {i}: {value}"
              assert float(row["broken_bonds"]) >= 0
          broken = [int(float(r["broken_bonds"])) for r in rows]
          assert all(b <= c for b, c in zip(broken, broken[1:])), "broken-bond count decreased"
          for name in ("checkpoint_3d.pt", "trajectory_3d.pt",
                       "load_displacement.csv", "cylinder_compression.png",
                       "cylinder_compression.pdf"):
              p = root / name
              assert p.is_file() and p.stat().st_size > 0, f"missing/empty output: {name}"
          report = {
              "samples": len(rows),
              "final_time_s": summary["final_time_s"],
              "peak_top_load_N": summary["peak_top_load_N"],
              "peak_bottom_load_N": summary["peak_bottom_load_N"],
              "final_broken_bonds": summary["final_broken_bonds"],
              "peak_broken_bonds": summary["peak_broken_bonds"],
              "history_rows_finite": True,
              "broken_bonds_monotonic": True,
              "note": summary["validation_note"],
          }
          (root / "long_run_validation.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload complete run and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensordem-cylinder-long-run
          path: results-cylinder-long/
          if-no-files-found: warn
          retention-days: 30
