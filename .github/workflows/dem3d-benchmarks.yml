name: DEM3D benchmark cases

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Repeat each case and require deterministic CPU signatures"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "benchmarks/dem3d/**"
      - "scripts/benchmark_dem3d.py"
      - "scripts/run_dem3d_benchmark_suite.py"
      - "src/tensordem/dem3d.py"
      - "src/tensordem/dem3d_energy.py"
      - ".github/workflows/dem3d-benchmarks.yml"

permissions:
  contents: read

jobs:
  benchmark-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run named DEM3D benchmark cases
        shell: bash
        run: |
          REPEAT_FLAG=""
          if [[ "${{ inputs.repeat }}" == "true" ]]; then
            REPEAT_FLAG="--verify-repeat"
          fi
          python scripts/run_dem3d_benchmark_suite.py \
            ${REPEAT_FLAG} \
            --output results-dem3d-benchmark-suite
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dem3d-benchmark-results-${{ github.run_id }}
          path: results-dem3d-benchmark-suite/
          if-no-files-found: warn
          retention-days: 30
